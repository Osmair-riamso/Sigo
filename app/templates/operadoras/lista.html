{% extends "base.html" %}

{% block content %}

<h2>Operadoras</h2>

<hr>

<form method="POST">

    <label>Nome da Operadora</label>

    <input
        type="text"
        name="nome"
        required>

    <br><br>

    <button type="submit">

        Salvar

    </button>

</form>

<br>

<table class="tabela">

    <thead>

        <tr>

            <th>ID</th>

            <th>Nome</th>

        </tr>

    </thead>

    <tbody>

    {% for operadora in operadoras %}

        <tr>

            <td>{{ operadora.id }}</td>

            <td>{{ operadora.nome }}</td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
