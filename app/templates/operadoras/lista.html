{% extends "base.html" %}

{% block content %}

<h2>Cadastro de Operadoras</h2>

<hr>

<form method="POST" class="form-card">

    {% if editar %}
        <input
            type="hidden"
            name="id"
            value="{{ editar.id }}">
    {% endif %}

    <label>Operadora</label>

    <input
        type="text"
        name="nome"
        required
        value="{{ editar.nome if editar else '' }}">

    <br><br>

    <button type="submit">

        {% if editar %}

            <i class="fa-solid fa-pen"></i>

            Atualizar

        {% else %}

            <i class="fa-solid fa-plus"></i>

            Salvar

        {% endif %}

    </button>

    {% if editar %}

        <a href="{{ url_for('operadoras.lista_operadoras') }}">

            Cancelar

        </a>

    {% endif %}

</form>

<hr>

<h3>Operadoras cadastradas</h3>

<table class="tabela">

    <thead>

        <tr>

            <th>Operadora</th>

            <th width="180">Ações</th>

        </tr>

    </thead>

<tbody>

        {% for operadora in operadoras %}

        <tr>

            <td>

                {{ operadora.nome }}

            </td>

            <td>

                <a
                    href="{{ url_for('operadoras.lista_operadoras', editar=operadora.id) }}">

                    <i class="fa-solid fa-pen"></i>

                    Editar

                </a>

                &nbsp;&nbsp;

                <form
                    method="POST"
                    action="{{ url_for('operadoras.excluir_operadora', id=operadora.id) }}"
                    style="display:inline;">

                    <button
                        type="submit"
                        onclick="return confirm('Deseja realmente excluir esta operadora?')">

                        <i class="fa-solid fa-trash"></i>

                        Excluir

                    </button>

                </form>

            </td>

        </tr>

        {% endfor %}

</tbody>

</table>

{% endblock %}
