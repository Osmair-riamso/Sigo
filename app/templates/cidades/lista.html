{% extends "base.html" %}

{% block content %}

<h2>Cadastro de Cidades</h2>

<hr>

<form method="POST" class="form-card">

    {% if editar %}
        <input
            type="hidden"
            name="id"
            value="{{ editar.id }}">
    {% endif %}

    <p>

        <label>Cidade</label>

        <input
            type="text"
            name="cidade"
            required
            value="{{ editar.cidade if editar else '' }}">

    </p>

    <p>

        <label>Estado (UF)</label>

        <input
            type="text"
            name="estado"
            maxlength="2"
            required
            value="{{ editar.estado if editar else '' }}">

    </p>

    <button type="submit">

        {% if editar %}

            <i class="fa-solid fa-pen"></i>

            Atualizar

        {% else %}

            <i class="fa-solid fa-plus"></i>

            Salvar

        {% endif %}

    </button>

    {% if editar %}

        <a
            href="{{ url_for('cidades.lista_cidades') }}"
            style="margin-left:15px;">

            Cancelar

        </a>

    {% endif %}

</form>

<hr>

<h3>Cidades cadastradas</h3>

<table class="tabela">

    <thead>

        <tr>

            <th>Cidade</th>

            <th>UF</th>

            <th width="220">Ações</th>

        </tr>

    </thead>

    <tbody>

        {% for cidade in cidades %}

        <tr>

            <td>

                {{ cidade.cidade }}

            </td>

            <td>

                {{ cidade.estado }}

            </td>

            <td>

                <a
                    href="{{ url_for('cidades.lista_cidades', editar=cidade.id) }}">

                    <i class="fa-solid fa-pen"></i>

                    Editar

                </a>

                &nbsp;&nbsp;

                <form
                    method="POST"
                    action="{{ url_for('cidades.excluir_cidade', id=cidade.id) }}"
                    style="display:inline;">

                    <button
                        type="submit"
                        onclick="return confirm('Deseja realmente excluir esta cidade?')">

                        <i class="fa-solid fa-trash"></i>

                        Excluir

                    </button>

                </form>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
