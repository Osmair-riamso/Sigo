{% extends "base.html" %}

{% block content %}

<h2>Login</h2>

<hr>

<form method="POST">

    <p>
        <label>Login</label>
        <input
            type="text"
            name="login"
            required>
    </p>

    <p>
        <label>Senha</label>
        <input
            type="password"
            name="senha"
            required>
    </p>

    <button type="submit">

        Entrar

    </button>

</form>

{% endblock %}
