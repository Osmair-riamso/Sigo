<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SIGO</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="topo">

    <div class="logo">

        <div class="logo-titulo">

            <i class="fa-solid fa-satellite-dish"></i>

            <h1>SIGO</h1>

        </div>

        <span>Sistema Integrado de Gestão Operacional</span>

    </div>

    <div class="topo-direita">

        <span id="relogio"></span>

        <button>Entrar</button>

    </div>

</header>

<div class="container">

    <aside class="menu">

        <ul>

            <li>
                <a href="{{ url_for('main.dashboard') }}">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Ocorrências
                </a>
            </li>

            <li>
            <a href="{{ url_for('circuitos.lista_circuitos') }}">
                <i class="fa-solid fa-network-wired"></i>
                Circuitos
            </a>
            </li>

            <li>
                <a href="{{ url_for('operadoras.lista_operadoras') }}">
                    <i class="fa-solid fa-building"></i>
                    Operadoras
                </a>
            </li>

            <li>
                <a href="{{ url_for('cidades.lista_cidades') }}">
                    <i class="fa-solid fa-city"></i>
                    Cidades
                </a>
            </li>

            <li>
                <a href="{{ url_for('usuarios.lista_usuarios') }}">
                    <i class="fa-solid fa-users"></i>
                    Usuários
                </a>
            </li>

        </ul>

    </aside>

    <main class="conteudo">

        {% block content %}

        {% endblock %}

    </main>

</div>

<footer>

    SIGO v0.1.0 • Desenvolvido por Osmair Pereira

</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
