{% extends "base.html" %}

{% block content %}

<h2>Cadastro de Usuários</h2>

<hr>

<form method="POST">

<p>

<label>Nome</label><br>

<input
type="text"
name="nome"
required>

</p>

<p>

<label>Login</label><br>

<input
type="text"
name="login"
required>

</p>

<p>

<label>Senha</label><br>

<input
type="password"
name="senha"
required>

</p>

<p>

<label>Perfil</label><br>

<select name="perfil">

    <option value="ADMIN">Administrador</option>

    <option value="USER">Usuário</option>

</select>

</p>

<button>

Salvar

</button>

</form>

<hr>

<table class="tabela">

<thead>

<tr>

<th>ID</th>

<th>Nome</th>

<th>Login</th>

<th>Perfil</th>

<th>Status</th>

</tr>

</thead>

<tbody>

{% for usuario in usuarios %}

<tr>

<td>{{ usuario.id }}</td>

<td>{{ usuario.nome }}</td>

<td>{{ usuario.login }}</td>

<td>{{ usuario.perfil }}</td>

<td>

{% if usuario.ativo %}

🟢

{% else %}

🔴

{% endif %}

</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
