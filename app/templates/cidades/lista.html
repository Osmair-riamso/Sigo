{% extends "base.html" %}

{% block content %}

<h2>Cadastro de Cidades</h2>

<hr>

<form method="POST">

    <label>Cidade</label>

    <input
        type="text"
        name="cidade"
        required>

    <br><br>

    <label>UF</label>

    <input
        type="text"
        name="estado"
        maxlength="2"
        required>

    <br><br>

    <button type="submit">

        Salvar

    </button>

</form>

<br>

<table class="tabela">

    <thead>

        <tr>

            <th>ID</th>
            <th>Cidade</th>
            <th>UF</th>

        </tr>

    </thead>

    <tbody>

    {% for cidade in cidades %}

        <tr>

            <td>{{ cidade.id }}</td>
            <td>{{ cidade.cidade }}</td>
            <td>{{ cidade.estado }}</td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
